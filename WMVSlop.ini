# WMVSlop settings. Lines are key=value. Delete a line to get its default.

# 1 plays the videos. 0 only writes WMVSlop.log.
video=1

# Where the video goes.
# 1 over the dashboard's background, under the tiles. The clip restarts when someone signs in to Xbox Live.
# 3 behind everything, with the dashboard's own background (and any theme wallpaper) hidden so it shows.
#   It keeps playing through a sign-in. Experimental.
# 2 inside the background, under the dashboard's own edge shading. The clip restarts at every sign-in.
# 0 at the very bottom, where the background covers it.
auto=1

# 1 plays videos straight off the stick a piece at a time: any size, no long pause while one loads.
# 0 loads each video into memory whole before playing it (the old way; the video has to fit in memory).
# If streaming gives no picture the plugin goes back to the old way by itself.
# Streaming needs this WMVSlop.ini file to be in the folder; without it videos are loaded whole.
stream=1

# 1 moves the video player's work onto the processor core the dashboard leaves idle. Experimental and off:
# with it on, one console stopped connecting to Xbox Live at sign-in. Only try it if you don't use Live.
spread=0

# 1 writes the dashboard's list of screen elements to WMVSlop.log (only needed for troubleshooting).
dump=0

# Size of the video on the dashboard's 1280x720 layout.
width=1280
height=720

# Frames of dashboard to wait before adding the video (60 is about 1 second). It also waits by itself until
# the dashboard's background exists.
delay=60

# 1 puts the video on top of everything, tiles included (to check that it plays at all).
front=0

# Sound level in dB, -96 (silent) to 6. Remove the # to set it; without it the dashboard's default is used.
#volume=0

# Advanced: the element to put the video under, and up to 4 elements to make see-through (one hide= line
# each). Element names come from the list dump=1 writes.
#attach=
#hide=
